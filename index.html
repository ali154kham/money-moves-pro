<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Moves Pro</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Money Moves Pro</h1>
        <p>Simple personal finance tracking for students and beginners.</p>
      </header>

      <section class="card summary-card" aria-label="Financial summary">
        <h2>Summary</h2>
        <div class="summary-grid">
          <article class="summary-item income">
            <h3>Total Income</h3>
            <p id="total-income">$0.00</p>
          </article>
          <article class="summary-item expense">
            <h3>Total Expenses</h3>
            <p id="total-expenses">$0.00</p>
          </article>
          <article class="summary-item balance">
            <h3>Remaining Balance</h3>
            <p id="remaining-balance">$0.00</p>
          </article>
        </div>
      </section>

      <section class="card" aria-label="Add or edit transaction">
        <h2 id="form-title">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <input type="hidden" id="transaction-id" />
          <div class="field-grid">
            <label>
              Description
              <input id="description" name="description" type="text" maxlength="80" required />
            </label>
            <label>
              Amount
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" required />
            </label>
            <label>
              Type
              <select id="type" name="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" id="save-btn">Save Transaction</button>
            <button type="button" id="cancel-btn" class="secondary hidden">Cancel Edit</button>
          </div>
          <p id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card" aria-label="Transaction history">
        <h2>Transaction History</h2>
        <ul id="transaction-list" class="transaction-list"></ul>
        <p id="empty-state" class="empty-state">No transactions yet. Add your first one above.</p>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
